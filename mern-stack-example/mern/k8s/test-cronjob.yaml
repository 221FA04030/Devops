apiVersion: batch/v1
kind: CronJob

metadata:
  name: test-cronjob

spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: test
              image: busybox
              command: ["sh", "-c", "echo CronJob executed"]
          restartPolicy: Never